[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phisheye"
version = "2.1.0"
authors = [
    { name = "harshh-0304", email = "bakasakuta33@gmail.com" },
]
description = "Real-Time Machine Learning Phishing URL & Threat Detection Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "cybersecurity", "phishing", "machine-learning", "threat-detection", "url-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "joblib>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.0",
    "flake8>=6.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
phisheye = "phisheye.cli:main"

[project.urls]
"Homepage" = "https://github.com/harshh-0304/PhishEye"
"Bug Tracker" = "https://github.com/harshh-0304/PhishEye/issues"
"Source" = "https://github.com/harshh-0304/PhishEye"
